[workspace]
members = [
    "crates/dopad-app",
    "crates/dopad-terminal",
    "crates/dopad-core",
    "crates/dopad-editor",
    "crates/dopad-syntax",
    "crates/dopad-preview",
    "crates/dopad-ipc",
    "crates/dopad-cli",
]
default-members = ["crates/dopad-app"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-channel = "=2.5.0"
async-process = "=2.5.0"
futures-lite = "=2.6.1"
lsp-types = "=0.97.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
portable-pty = "=0.9.0"
gpui-kit = "=0.8.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
open = "=5.3.2"
markdown = "=1.0.0"
regex = "=1.13.1"
ignore = "=0.4.34"
interprocess = "=2.4.7"
libc = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
url = "=2.5.8"
rust-embed = "=8.13.0"
resvg = "=0.46.0"
roxmltree = "=0.20.0"
ropey = { version = "=1.6.1", default-features = false, features = ["simd", "cr_lines"] }
tiny-skia = "=0.11.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "=1.13.3"
tempfile = "=3.27.0"
rfd = "=0.16.1"
thiserror = "=2.0.21"
widestring = "=1.2.1"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls"] }
semver = "=1.0.28"
base64 = "=0.22.1"
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
usvg = "=0.46.0"
tree-sitter = "=0.26.13"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-powershell = "=0.26.4"
tree-sitter-swift = "=0.7.4"
tree-sitter-xml = "=0.7.0"
arborium-scss = "=2.18.2"


name: Dopad CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dopad-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality-linux-x64
      - name: Install GPUI build dependencies
        run: bash scripts/install/install-linux-build-deps.sh
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --locked

  native-build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            os: windows
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            os: windows
            target: aarch64-pc-windows-msvc
          - platform: macos-x64
            runner: macos-15-intel
            os: macos
            target: x86_64-apple-darwin
          - platform: macos-arm64
            runner: macos-15
            os: macos
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            os: linux
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.target }}
      - name: Install Linux native dependencies
        if: matrix.os == 'linux'
        run: bash scripts/install/install-linux-build-deps.sh
      - name: Verify native Rust target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hostTarget = (rustc -vV | Select-String '^host:').ToString().Split(':')[1].Trim()
          if ($hostTarget -ne '${{ matrix.target }}') { throw "Expected native target ${{ matrix.target }}, got $hostTarget" }
      - name: Verify native Rust target
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host_target" = '${{ matrix.target }}'
      - name: Build Desktop and CLI
        if: runner.os != 'Windows'
        run: cargo build --release --locked -p dopad-app -p dopad-cli
      - name: Build and smoke-test Windows Desktop and CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install/build-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows build or CLI smoke test failed' }
      - name: Smoke-test CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./target/release/dopad --version
          ./target/release/dopad --help >/dev/null

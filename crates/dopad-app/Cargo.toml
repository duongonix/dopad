[package]
name = "dopad-app"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-process.workspace = true
futures-lite.workspace = true
gpui-kit = { workspace = true, features = [
	"tree-sitter",
	"tree-sitter-c",
	"tree-sitter-csharp",
	"tree-sitter-cpp",
	"tree-sitter-css",
	"tree-sitter-bash",
	"tree-sitter-go",
	"tree-sitter-html",
	"tree-sitter-java",
    "tree-sitter-javascript",
	"tree-sitter-kotlin",
    "tree-sitter-markdown",
	"tree-sitter-php",
    "tree-sitter-python",
	"tree-sitter-ruby",
    "tree-sitter-rust",
	"tree-sitter-sql",
	"tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-yaml",
] }
image.workspace = true
open.workspace = true
ignore.workspace = true
lsp-types.workspace = true
regex.workspace = true
rfd.workspace = true
serde.workspace = true
tempfile.workspace = true
dopad-core = { path = "../dopad-core" }
dopad-editor = { path = "../dopad-editor" }
dopad-preview = { path = "../dopad-preview" }
dopad-terminal = { path = "../dopad-terminal" }
dopad-syntax = { path = "../dopad-syntax" }
dopad-ipc = { path = "../dopad-ipc" }
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
url.workspace = true
rust-embed.workspace = true
ureq.workspace = true
semver.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
tree-sitter.workspace = true
tree-sitter-c-sharp.workspace = true
tree-sitter-powershell.workspace = true
tree-sitter-swift.workspace = true
tree-sitter-xml.workspace = true
arborium-scss.workspace = true
windows-sys.workspace = true

[build-dependencies]
embed-resource = "=3.0.12"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10", features = ["test-support"] }

[[bench]]
name = "syntax_workloads"
harness = false
